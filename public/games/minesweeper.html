<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .game-window {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .digital-disp {
      font-family: monospace;
      font-size: 24px;
      font-weight: bold;
      color: #ef4444;
      background: #020617;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: 2px solid #475569;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:hover { background: #475569; }
    .grid {
      display: grid;
      gap: 2px;
      background: #334155;
      border: 2px solid #334155;
      border-radius: 4px;
      overflow: hidden;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-top: 2px solid #64748b;
      border-left: 2px solid #64748b;
      border-right: 2px solid #334155;
      border-bottom: 2px solid #334155;
    }
    .cell.revealed {
      background: #1e293b;
      border: 1px solid #334155;
      cursor: default;
    }
    .cell.mine { background: #ef4444; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #c084fc; }
    .c-5 { color: #fb923c; }
    .c-6 { color: #2dd4bf; }
    .c-7 { color: #e2e8f0; }
    .c-8 { color: #94a3b8; }
    .footer {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      justify-content: center;
    }
    .mode-btn {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active { background: #2563eb; color: white; }
  </style>
</head>
<body>
  <div class="game-window">
    <div class="mode-toggle">
      <button id="btn-easy" class="mode-btn active" onclick="setDiff(9, 9, 10)">9x9 (10 Mines)</button>
      <button id="btn-med" class="mode-btn" onclick="setDiff(12, 12, 22)">12x12 (22 Mines)</button>
    </div>

    <div class="header-bar">
      <div id="mines-disp" class="digital-disp">010</div>
      <button id="face" class="face-btn" onclick="initGame()">🙂</button>
      <div id="timer-disp" class="digital-disp">000</div>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <div class="footer">
    Left-click to reveal  •  Right-click (or Long press) to Flag 🚩
  </div>

  <script>
    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let grid = [];
    let state = 'ready'; // ready, playing, lost, won
    let timer = 0;
    let timerInterval = null;
    let flaggedCount = 0;

    function setDiff(r, c, m) {
      rows = r;
      cols = c;
      totalMines = m;
      document.getElementById('btn-easy').classList.toggle('active', r === 9);
      document.getElementById('btn-med').classList.toggle('active', r === 12);
      initGame();
    }

    function initGame() {
      if (timerInterval) clearInterval(timerInterval);
      timer = 0;
      state = 'ready';
      flaggedCount = 0;
      document.getElementById('face').textContent = '🙂';
      document.getElementById('timer-disp').textContent = '000';
      updateMinesDisplay();

      // Setup board
      grid = [];
      const gridEl = document.getElementById('grid');
      gridEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
      gridEl.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
          grid[r][c] = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0
          };
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.id = `cell-${r}-${c}`;
          cellEl.addEventListener('click', () => handleClick(r, c));
          cellEl.addEventListener('contextmenu', e => {
            e.preventDefault();
            handleRightClick(r, c);
          });
          gridEl.appendChild(cellEl);
        }
      }
    }

    function updateMinesDisplay() {
      const remaining = Math.max(0, totalMines - flaggedCount);
      document.getElementById('mines-disp').textContent = String(remaining).padStart(3, '0');
    }

    function plantMines(firstR, firstC) {
      let planted = 0;
      while (planted < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (!grid[r][c].mine && !(r === firstR && c === firstC)) {
          grid[r][c].mine = true;
          planted++;
        }
      }

      // Count neighbors
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].mine) {
                  count++;
                }
              }
            }
            grid[r][c].count = count;
          }
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        if (timer < 999) {
          document.getElementById('timer-disp').textContent = String(timer).padStart(3, '0');
        }
      }, 1000);
    }

    function handleClick(r, c) {
      if (state === 'lost' || state === 'won') return;
      const cell = grid[r][c];
      if (cell.flagged || cell.revealed) return;

      if (state === 'ready') {
        state = 'playing';
        plantMines(r, c);
        startTimer();
      }

      if (cell.mine) {
        lose(r, c);
        return;
      }

      reveal(r, c);
      checkWin();
    }

    function handleRightClick(r, c) {
      if (state === 'lost' || state === 'won') return;
      const cell = grid[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      flaggedCount += cell.flagged ? 1 : -1;
      const el = document.getElementById(`cell-${r}-${c}`);
      el.textContent = cell.flagged ? '🚩' : '';
      updateMinesDisplay();
    }

    function reveal(r, c) {
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      const el = document.getElementById(`cell-${r}-${c}`);
      el.classList.add('revealed');

      if (cell.count > 0) {
        el.textContent = cell.count;
        el.classList.add(`c-${cell.count}`);
      } else {
        // Cascade empty cells
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              reveal(nr, nc);
            }
          }
        }
      }
    }

    function lose(hitR, hitC) {
      state = 'lost';
      clearInterval(timerInterval);
      document.getElementById('face').textContent = '😵';

      // Reveal all mines
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].mine) {
            const el = document.getElementById(`cell-${r}-${c}`);
            el.classList.add('revealed', 'mine');
            el.textContent = '💣';
          }
        }
      }
    }

    function checkWin() {
      let unrevealedNonMines = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].mine && !grid[r][c].revealed) {
            unrevealedNonMines++;
          }
        }
      }

      if (unrevealedNonMines === 0) {
        state = 'won';
        clearInterval(timerInterval);
        document.getElementById('face').textContent = '😎';
      }
    }

    initGame();
  </script>
</body>
</html>
