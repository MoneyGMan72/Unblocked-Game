<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 400px;
      max-width: 95vw;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: #1e293b;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    .score-box { font-size: 14px; font-weight: 600; color: #94a3b8; }
    .score-val { color: #38bdf8; font-size: 18px; font-weight: bold; margin-left: 4px; }
    #canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      image-rendering: pixelated;
    }
    .controls-hint {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .key {
      background: #334155;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      width: 400px;
      height: 400px;
      border-radius: 8px;
    }
    .overlay h2 { font-size: 26px; color: #ef4444; margin-bottom: 8px; }
    .overlay button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.15s;
    }
    .overlay button:hover { background: #1d4ed8; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="score-box">SCORE: <span id="score" class="score-val">0</span></div>
    <div class="score-box">HIGH: <span id="high-score" class="score-val">0</span></div>
  </div>

  <div style="position: relative;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="game-over" class="overlay hidden">
      <h2>GAME OVER</h2>
      <p style="color: #94a3b8;">Final Score: <span id="final-score" style="color: white; font-weight: bold;">0</span></p>
      <button onclick="startGame()">PLAY AGAIN</button>
    </div>
    <div id="start-screen" class="overlay">
      <h2 style="color: #38bdf8;">RETRO SNAKE</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Use arrow keys or WASD</p>
      <button onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div class="controls-hint">
    <span>Move: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> or Arrows</span>
    <span>•</span>
    <span>Pause: <span class="key">Space</span></span>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high_score') || 0;
    document.getElementById('high-score').textContent = highScore;
    let gameLoop = null;
    let isPaused = false;
    let isRunning = false;

    // Audio context for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over').classList.add('hidden');
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      score = 0;
      document.getElementById('score').textContent = score;
      placeFood();
      isRunning = true;
      isPaused = false;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function update() {
      if (isPaused || !isRunning) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        playBeep(600, 0.1);
        document.getElementById('score').textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_high_score', highScore);
          document.getElementById('high-score').textContent = highScore;
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#1e293b';
      for (let x = 0; x < canvas.width; x += gridSize) {
        for (let y = 0; y < canvas.height; y += gridSize) {
          ctx.fillRect(x + 9, y + 9, 2, 2);
        }
      }

      // Draw Food (glowing red apple)
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#38bdf8'; // head
        } else {
          ctx.fillStyle = index % 2 === 0 ? '#10b981' : '#059669';
        }
        ctx.fillRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      playBeep(180, 0.3);
      document.getElementById('final-score').textContent = score;
      document.getElementById('game-over').classList.remove('hidden');
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (!isRunning && (e.key === ' ' || e.key === 'Enter')) {
        startGame();
        return;
      }

      if (e.key === ' ' && isRunning) {
        isPaused = !isPaused;
        return;
      }

      const key = e.key.toLowerCase();
      if ((key === 'arrowup' || key === 'w') && dy === 0) {
        dx = 0; dy = -1;
      } else if ((key === 'arrowdown' || key === 's') && dy === 0) {
        dx = 0; dy = 1;
      } else if ((key === 'arrowleft' || key === 'a') && dx === 0) {
        dx = -1; dy = 0;
      } else if ((key === 'arrowright' || key === 'd') && dx === 0) {
        dx = 1; dy = 0;
      }
    });

    draw();
  </script>
</body>
</html>
